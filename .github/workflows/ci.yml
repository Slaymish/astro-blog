name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: qnuj1c4o
      SANITY_DATASET: production
      SANITY_API_VERSION: 2024-01-01

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pure tests, before there is a build. The build-output suites skip.
      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Again, now that dist/ exists: the build-output and redirect suites run.
      - name: Run tests against the build
        run: pnpm run test

      - name: Check for dead code
        run: pnpm exec knip

      - name: Build Studio
        run: pnpm run studio:build

version: 2
updates:
  # Dependabot uses the npm ecosystem for pnpm-lock.yaml too.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      site-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The standalone Studio has its own package.json and package-lock.json.
  - package-ecosystem: "npm"
    directory: "/studio-production"
    schedule:
      interval: "weekly"
    groups:
      studio-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

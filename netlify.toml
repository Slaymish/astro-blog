[build]
  publish = "dist"
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "22"
  SANITY_PROJECT_ID = "qnuj1c4o"
  SANITY_DATASET = "production"
  SANITY_API_VERSION = "2024-01-01"

# Fingerprinted Astro assets — cache forever, filenames change with content.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The full Content-Security-Policy is emitted per page as a <meta> element by
# Astro's security.csp, with a SHA-256 hash for the one inline script. A header
# that also named script-src would be enforced alongside that meta policy and
# would block the hashed script, so the header carries only the directive a
# meta element cannot express.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Video is served from public/ under media-src 'self'. A week rather than
# immutable: the filenames are stable, so a re-cut clip has to be able to
# replace itself. This has to sit after the /* catch-all, because two rules
# that both match resolve to the later one; above it the video was served with
# the catch-all's max-age=0. The /_astro rule escapes that only because the
# Astro adapter writes it into .netlify/v1/config.json, which outranks this file.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/stats"
  [headers.values]
    Cache-Control = "no-store"

# Legacy URL policy lives only here. force = true so these win over any

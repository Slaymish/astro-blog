[build]
  publish = "dist"
  command = "pnpm run build"

[build.environment]
  SANITY_PROJECT_ID = "qnuj1c4o"
  SANITY_DATASET = "production"
  SANITY_API_VERSION = "2024-01-01"

# Fingerprinted Astro assets — cache forever (filenames change on content change)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages and embedded JSON-LD use bounded edge caching
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=600"

# RSS is generated on demand from Sanity and must always return current content
[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "no-store"

# API routes — never cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "http://hamishburke.dev/*"
  to = "https://hamishburke.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.hamishburke.dev/*"
  to = "https://hamishburke.dev/:splat"
  status = 301
  force = true
